<style>
  :root{
    --bg-canvas:#0E0E12; --bg-panel:#17171C; --bg-elevated:#1F1F26;
    --accent:#FFC93C; --text-primary:#F2F2F5; --text-secondary:#8A8A94;
    --text-tertiary:#5C5C66; --border:#2A2A32;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg-canvas); color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    overflow:hidden; display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    flex-shrink:0; height:60px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:0 20px; border-bottom:1px solid var(--border); position:relative; z-index:20;
  }
  .left{ display:flex; align-items:center; gap:18px; min-width:0; flex:1; }
  .right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .brand{ font-size:20px; font-weight:800; letter-spacing:-0.02em; flex-shrink:0; }
  .brand::after{ content:'.'; color:var(--accent); }

  /* tabs */
  #tabs{ display:flex; align-items:center; gap:4px; overflow-x:auto; scrollbar-width:none; min-width:0; }
  #tabs::-webkit-scrollbar{ display:none; }
  .tab{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px;
    font-size:13px; font-weight:600; color:var(--text-tertiary); cursor:pointer;
    border:1px solid transparent; white-space:nowrap; transition:color .15s;
  }
  .tab:hover{ color:var(--text-secondary); }
  .tab.other{ color:var(--text-secondary); background:rgba(255,255,255,.04); }
  .tab.active{ color:var(--accent); background:rgba(255,201,60,.08); border-color:rgba(255,201,60,.25); }
  .tab input{
    background:transparent; border:none; outline:none; color:inherit; font:inherit;
    padding:0; min-width:0; user-select:text; -webkit-user-select:text;
  }
  .tab-x{ font-style:normal; font-size:15px; line-height:1; opacity:0; margin-right:-4px; transition:opacity .15s; }
  .tab:hover .tab-x{ opacity:.6; }
  .tab-x:hover{ opacity:1 !important; color:#FF7A6E; }
  #add-tab{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:transparent;
    color:var(--text-tertiary); cursor:pointer; font-size:16px; line-height:1; flex-shrink:0;
    transition:color .15s, border-color .15s;
  }
  #add-tab:hover{ color:var(--text-primary); border-color:#3a3a44; }

  .device-wrap{ position:relative; }
  #device-btn, #split-btn, #clear-btn{
    display:flex; align-items:center; gap:8px; background:var(--bg-elevated);
    border:1px solid var(--border); color:var(--text-primary); font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:20px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  #device-btn:hover, #split-btn:hover{ border-color:#3a3a44; }
  #device-btn .ratio-chip{
    font-size:11px; font-weight:600; color:var(--text-tertiary);
    background:rgba(255,255,255,0.05); padding:2px 7px; border-radius:20px;
  }
  #device-btn svg{ width:13px; height:13px; color:var(--text-tertiary); transition:transform .15s; }
  #device-btn.open svg{ transform:rotate(180deg); }
  #split-btn{ padding:8px 11px; color:var(--text-tertiary); }
  #split-btn svg{ width:18px; height:18px; }
  #split-btn.on{ color:var(--accent); border-color:rgba(255,201,60,.5); }
  #clear-btn{ background:transparent; color:var(--text-secondary); font-size:12.5px; }
  #clear-btn:hover{ color:#FF7A6E; border-color:#4a2c28; }

  #device-panel{
    position:absolute; top:44px; right:0;
    width:340px; max-height:min(70vh, 520px); overflow-y:auto;
    background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.5); display:none; padding:6px;
  }
  #device-panel.open{ display:block; }
  .group-label{ font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:10px 10px 6px; }
  .device-row{ padding:9px 11px; border-radius:8px; cursor:pointer; }
  .device-row:hover{ background:var(--bg-elevated); }
  .device-row.active{ background:rgba(255,201,60,0.08); }
  .device-row.active .device-row-name{ color:var(--accent); }
  .device-row-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .device-row-name{ font-size:13.5px; font-weight:600; color:var(--text-primary); }
  .device-row-ratio{ color:var(--text-tertiary); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .device-row-sub{ margin-top:3px; font-size:11px; color:var(--text-tertiary); line-height:1.5; }

  /* ---------- Stage ---------- */
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  #frame-sizer{ position:relative; }
  #frame{ position:absolute; top:0; left:0; transform-origin:top left; display:flex; gap:72px; }
  .pane{ position:relative; flex-shrink:0; }
  .bezel{
    background:linear-gradient(165deg,#2a2a2f,#0a0a0c 55%);
    border-radius:var(--bz-radius,46px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .screen{
    position:relative; background:#000; border-radius:var(--sc-radius,34px);
    overflow-y:auto; overflow-x:hidden; scrollbar-width:none; cursor:grab; user-select:none;
  }
  .screen::-webkit-scrollbar{ display:none; }
  .screen.grabbing{ cursor:grabbing; }
  .pane.focus .bezel{ outline:3px solid rgba(255,201,60,.45); outline-offset:6px; }
  .pane.drag-active .bezel{ outline:3px dashed var(--accent); outline-offset:6px; }

  .cut-wrap img{ display:block; width:690px; height:auto; user-select:none; -webkit-user-drag:none; pointer-events:none; }

  .status-bar{
    position:absolute; top:0; left:0; right:0; height:78px;
    display:flex; align-items:flex-start; justify-content:space-between; padding:22px 26px 0;
    pointer-events:none; z-index:5; background:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,0));
  }
  .status-time{ color:#fff; font-size:28px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.35); }
  .status-icons{ display:flex; gap:10px; align-items:center; }
  .status-icons svg{ width:32px; height:24px; color:#fff; filter:drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
  .island{ position:absolute; top:21px; left:50%; transform:translateX(-50%); width:100px; height:30px; background:#000; border-radius:20px; z-index:6; }
  .punch-hole{ position:absolute; top:24px; left:50%; transform:translateX(-50%); width:11px; height:11px; background:#000; border-radius:50%; z-index:6; box-shadow:0 0 0 2px #050506; }
  .home-indicator{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:120px; height:4px; background:#fff; border-radius:3px; mix-blend-mode:difference; z-index:6; }

  .scrollbar-track{ position:absolute; top:0; right:-36px; width:25px; border-radius:3px; z-index:15; opacity:0; transition:opacity .2s ease; pointer-events:none; }
  .scrollbar-track.visible{ opacity:1; pointer-events:auto; }
  .scrollbar-thumb{ position:absolute; left:0; width:100%; background:rgba(255,255,255,.35); border-radius:5px; cursor:pointer; transition:background .15s; }
  .scrollbar-thumb:hover, .scrollbar-thumb.dragging{ background:rgba(255,255,255,.6); }
  body.no-select, body.no-select *{ user-select:none !important; -webkit-user-select:none !important; }

  .empty-screen{
    height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:26px; color:var(--text-tertiary); text-align:center; padding:0 14px; cursor:pointer;
  }
  .empty-screen svg{ width:120px; height:120px; opacity:.4; }
  .empty-main{ display:flex; flex-direction:column; gap:14px; }
  .empty-main p{ font-size:32px; line-height:1.6; color:var(--text-primary); font-weight:500; }
  .empty-main .hint{ font-size:25px; color:var(--text-tertiary); white-space:nowrap; }
  .empty-tips{ display:flex; flex-direction:column; gap:12px; padding-top:24px; border-top:1px solid var(--border); width:100%; max-width:620px; }
  .tip-row{ font-size:23px; color:var(--text-tertiary); opacity:.75; line-height:1.5; white-space:nowrap; }

  #file-input{ display:none; }
  #site-footer{ flex-shrink:0; text-align:center; padding:10px 0; font-size:12px; color:var(--text-tertiary); border-top:1px solid var(--border); }
  #site-footer a{ color:var(--text-secondary); text-decoration:none; margin:0 8px; }
  #site-footer a:hover{ color:var(--accent); }
</style>
</head>

<script>
(function(){
  // 푸터(소개·개인정보처리방침·문의) 표시 스위치 — true로 바꾸면 다시 나타나요
  const SHOW_FOOTER = false;
  document.getElementById('site-footer').hidden = !SHOW_FOOTER;

  const CONTENT_WIDTH = 690, GAP = 72;

  const DEVICES = [
    { group:'iPhone', name:'아이폰', label:'19.5:9', ratio:19.5/9, kind:'island',
      sub:'iPhone 12 ~ 17 (Air 포함) 전체 라인업 — 화면비 전부 동일' },
    { group:'Galaxy', name:'갤럭시', label:'20:9', ratio:20/9, kind:'hole',
      sub:'S20 / S20+ / S20 Ultra / S21 / S21+ / S21 Ultra' },
    { group:'Galaxy', name:'갤럭시', label:'19.5:9', ratio:19.5/9, kind:'hole',
      sub:'S22 / S22+ / S23 / S23+ / S24 / S24+ / S24 Ultra / S25 / S25+ / S25 Ultra / S26 / S26+ / S26 Ultra' },
    { group:'Galaxy', name:'갤럭시', label:'19.3:9', ratio:19.3/9, kind:'hole',
      sub:'S22 Ultra / S23 Ultra' },
  ];

  // tabs: [{id,name,images:[],scroll}], panes: 각 화면이 보여주는 탭 id
  const state = { tabs:[], panes:[null,null], split:false, focus:0, deviceIndex:0, panelOpen:false };
  let tabSeq = 0, pendingPane = 0, currentScale = 1;

  const $ = id => document.getElementById(id);
  const deviceBtn = $('device-btn'), deviceBtnLabel = $('device-btn-label'), deviceBtnRatio = $('device-btn-ratio');
  const devicePanel = $('device-panel'), clearBtn = $('clear-btn'), splitBtn = $('split-btn');
  const tabsEl = $('tabs'), stage = $('stage'), frameSizer = $('frame-sizer'), frame = $('frame'), fileInput = $('file-input');
  const IMG_RE = /\.(jpe?g|png|webp)$/i;

  const naturalSort = (a, b) => a.localeCompare(b, 'ko-KR', { numeric:true, sensitivity:'base' });
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tabById = id => state.tabs.find(t => t.id === id);
  const paneTab = p => tabById(state.panes[p]);

  const TAB_NAMES = ['쭉','쑥','뿍','훕','뚝','쿡','꾹','욲','툭','츅','풉'];
  function newTab(){
    const t = { id:++tabSeq, name:TAB_NAMES[(tabSeq - 1) % TAB_NAMES.length], images:[], scroll:0 };
    state.tabs.push(t);
    return t;
  }
  state.panes[0] = newTab().id;

  // ---------- files: 드롭하면 해당 화면의 탭 내용이 교체됨 ----------
  function setFiles(files, p){
    const imgs = files.filter(f => IMG_RE.test(f.name)).sort((a,b) => naturalSort(a.name, b.name));
    if(!imgs.length) return;
    const tab = paneTab(p);
    tab.images.forEach(i => URL.revokeObjectURL(i.url));
    tab.scroll = 0;
    const s = frame.querySelector(`.pane[data-pane="${p}"] .screen`);
    if(s) s.scrollTop = 0;
    tab.images = imgs.map(f => {
      const e = { name:f.name, url:URL.createObjectURL(f), w:0, h:0, loaded:false };
      const im = new Image();
      im.onload = () => { e.w = im.naturalWidth; e.h = im.naturalHeight; e.loaded = true; renderFrame(); };
      im.src = e.url;
      return e;
    });
    setFocus(p);
    renderFrame();
  }

  function clearFocused(){
    const tab = paneTab(state.focus);
    tab.images.forEach(i => URL.revokeObjectURL(i.url));
    tab.images = []; tab.scroll = 0;
    renderFrame();
  }

  function traverseEntry(entry, out){
    return new Promise(resolve => {
      if(entry.isFile){
        entry.file(file => { out.push(file); resolve(); }, () => resolve());
      } else if(entry.isDirectory){
        const reader = entry.createReader();
        const readBatch = () => {
          reader.readEntries(async entries => {
            if(!entries.length){ resolve(); return; }
            await Promise.all(entries.map(e => traverseEntry(e, out)));
            readBatch();
          }, () => resolve());
        };
        readBatch();
      } else resolve();
    });
  }

  // ---------- drag & drop (스테이지 어디든, 폰 위면 그 폰에) ----------
  const paneOf = e => e.target.closest && e.target.closest('.pane');
  ['dragenter','dragover'].forEach(evt => stage.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    const pn = paneOf(e);
    frame.querySelectorAll('.pane.drag-active').forEach(x => { if(x !== pn) x.classList.remove('drag-active'); });
    if(pn) pn.classList.add('drag-active');
  }));
  stage.addEventListener('dragleave', e => {
    const pn = paneOf(e);
    if(pn && !pn.contains(e.relatedTarget)) pn.classList.remove('drag-active');
  });
  stage.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation();
    const pn = paneOf(e);
    frame.querySelectorAll('.drag-active').forEach(x => x.classList.remove('drag-active'));
    const p = pn ? +pn.dataset.pane : state.focus;
    const items = e.dataTransfer.items;
    if(items && items.length && items[0].webkitGetAsEntry){
      const out = [];
      const entries = Array.from(items).map(it => it.webkitGetAsEntry()).filter(Boolean);
      await Promise.all(entries.map(en => traverseEntry(en, out)));
      setFiles(out, p);
    } else {
      setFiles(Array.from(e.dataTransfer.files || []), p);
    }
  });
  // 폰 밖에 떨어뜨려도 브라우저가 파일을 열어버리지 않게
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  frame.addEventListener('click', e => {
    if(e.target.closest('.empty-screen')){
      pendingPane = +e.target.closest('.pane').dataset.pane;
      fileInput.click();
    }
  });
  fileInput.addEventListener('change', e => {
    setFiles(Array.from(e.target.files || []), pendingPane);
    fileInput.value = '';
  });
  clearBtn.addEventListener('click', clearFocused);

  // ---------- tabs ----------
  function renderTabs(){
    tabsEl.innerHTML = state.tabs.map(t => {
      const slots = [0,1].filter(i => (i === 0 || state.split) && state.panes[i] === t.id);
      const cls = slots.includes(state.focus) ? ' active' : (slots.length ? ' other' : '');
      return `<div class="tab${cls}" data-id="${t.id}"><span>${esc(t.name)}</span>${state.tabs.length > 1 ? `<i class="tab-x" data-x="${t.id}">×</i>` : ''}</div>`;
    }).join('') + `<button id="add-tab" title="새 탭">+</button>`;
  }
  tabsEl.addEventListener('click', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.target.closest('#add-tab')){
      state.panes[state.focus] = newTab().id;
    } else if(e.target.dataset.x){
      closeTab(+e.target.dataset.x); return;
    } else {
      const el = e.target.closest('.tab');
      if(!el || state.panes[state.focus] === +el.dataset.id) return;
      state.panes[state.focus] = +el.dataset.id;
    }
    renderTabs(); renderFrame();
  });
  tabsEl.addEventListener('dblclick', e => {
    const el = e.target.closest('.tab');
    if(!el) return;
    const t = tabById(+el.dataset.id);
    const span = el.querySelector('span');
    if(!span) return;
    const input = document.createElement('input');
    input.value = t.name;
    input.maxLength = 20;
    const fit = () => { input.style.width = Math.max(2, (input.value.length + 1) * 0.95) + 'em'; };
    fit();
    let done = false;
    const finish = save => {
      if(done) return;
      done = true;
      if(save && input.value.trim()) t.name = input.value.trim();
      renderTabs();
    };
    input.addEventListener('input', fit);
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', ev => {
      if(ev.key === 'Enter') finish(true);
      else if(ev.key === 'Escape') finish(false);
    });
    span.replaceWith(input);
    input.focus();
    input.select();
  });
  function closeTab(id){
    const idx = state.tabs.findIndex(t => t.id === id);
    state.tabs[idx].images.forEach(i => URL.revokeObjectURL(i.url));
    state.tabs.splice(idx, 1);
    const fallback = state.tabs[Math.max(0, idx - 1)].id;
    state.panes = state.panes.map(p => p === id ? fallback : p);
    renderTabs(); renderFrame();
  }

  // ---------- split ----------
  splitBtn.addEventListener('click', () => {
    state.split = !state.split;
    state.focus = 0;
    if(state.split){
      const other = state.tabs.find(t => t.id !== state.panes[0]) || newTab();
      state.panes[1] = other.id;
    }
    renderTabs(); renderFrame();
  });
  function setFocus(p){
    if(state.focus === p && !state.split) return;
    state.focus = p;
    frame.querySelectorAll('.pane').forEach(pn => pn.classList.toggle('focus', state.split && +pn.dataset.pane === p));
    renderTabs();
  }

  // ---------- 스크롤: 클릭&드래그 / Shift 3배속 / Ctrl 동시 ----------
  const allScreens = () => Array.from(frame.querySelectorAll('.screen'));
  let dragScroll = { active:false, startY:0, main:null, els:[] };
  let sbDrag = null;

  frame.addEventListener('mousedown', e => {
    const screenEl = e.target.closest('.screen');
    const pn = e.target.closest('.pane');
    if(pn && state.split) setFocus(+pn.dataset.pane);
    if(!screenEl) return;
    dragScroll = { active:true, startY:e.clientY, main:screenEl, els:allScreens().map(el => ({ el, top:el.scrollTop })) };
    screenEl.classList.add('grabbing');
    document.body.classList.add('no-select');
  });
  document.addEventListener('mousemove', e => {
    if(sbDrag){
      const dy = (e.clientY - sbDrag.startY) / currentScale;
      const maxScroll = sbDrag.screen.scrollHeight - sbDrag.screen.clientHeight;
      sbDrag.screen.scrollTop = sbDrag.startTop + (dy / sbDrag.trackH) * maxScroll;
      return;
    }
    if(!dragScroll.active) return;
    const dy = (e.clientY - dragScroll.startY) / currentScale;
    dragScroll.els.forEach(o => { if(o.el === dragScroll.main || e.ctrlKey) o.el.scrollTop = o.top - dy; });
  });
  document.addEventListener('mouseup', () => {
    if(dragScroll.main) dragScroll.main.classList.remove('grabbing');
    dragScroll = { active:false, startY:0, main:null, els:[] };
    if(sbDrag){ sbDrag.done(); sbDrag = null; }
    document.body.classList.remove('no-select');
  });
  document.addEventListener('selectstart', e => { if(dragScroll.active || sbDrag) e.preventDefault(); });

  stage.addEventListener('wheel', e => {
    if(!(e.ctrlKey || e.shiftKey)) return;
    const screens = allScreens();
    if(!screens.length) return;
    e.preventDefault();
    const d = (e.deltaY || e.deltaX) * (e.shiftKey ? 3 : 1);
    const pn = paneOf(e);
    const own = pn ? pn.querySelector('.screen') : screens[0];
    (e.ctrlKey ? screens : [own]).forEach(s => { s.scrollTop += d; });
  }, { passive:false });

  function setupScrollbar(pane){
    const screenEl = pane.querySelector('.screen');
    const track = pane.querySelector('.scrollbar-track');
    const thumb = pane.querySelector('.scrollbar-thumb');
    let hideTimer;

    function updateThumb(){
      const trackH = track.clientHeight;
      const ratio = Math.min(1, (screenEl.clientHeight / screenEl.scrollHeight) * 1.5);
      if(ratio >= 1){ track.style.display = 'none'; return; }
      track.style.display = '';
      const thumbH = Math.max(48, trackH * ratio);
      const maxScroll = screenEl.scrollHeight - screenEl.clientHeight;
      thumb.style.height = thumbH + 'px';
      thumb.style.top = ((trackH - thumbH) * (maxScroll > 0 ? screenEl.scrollTop / maxScroll : 0)) + 'px';
    }
    const hideSoon = () => { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if(!sbDrag) track.classList.remove('visible'); }, 900); };
    const showTrack = () => { track.classList.add('visible'); hideSoon(); };
    const hold = () => { clearTimeout(hideTimer); track.classList.add('visible'); };

    screenEl.addEventListener('scroll', () => { updateThumb(); showTrack(); });
    screenEl.addEventListener('mouseenter', hold);
    track.addEventListener('mouseenter', hold);
    screenEl.addEventListener('mouseleave', () => { if(!sbDrag) showTrack(); });
    track.addEventListener('mouseleave', () => { if(!sbDrag) showTrack(); });

    thumb.addEventListener('mousedown', e => {
      e.stopPropagation();
      sbDrag = { screen:screenEl, startY:e.clientY, startTop:screenEl.scrollTop, trackH:track.clientHeight,
                 done:() => { thumb.classList.remove('dragging'); hideSoon(); } };
      thumb.classList.add('dragging');
      track.classList.add('visible');
      document.body.classList.add('no-select');
    });
    track.addEventListener('click', e => {
      if(e.target === thumb) return;
      const rect = track.getBoundingClientRect();
      screenEl.scrollTop = ((e.clientY - rect.top) / rect.height) * (screenEl.scrollHeight - screenEl.clientHeight);
    });
    updateThumb();
  }

  // ---------- device picker ----------
  function renderDevicePanel(){
    devicePanel.innerHTML = ['iPhone','Galaxy'].map(g => `
      <div class="group-label">${g}</div>
      ${DEVICES.map((d,i) => d.group === g ? `
        <div class="device-row ${i === state.deviceIndex ? 'active' : ''}" data-idx="${i}">
          <div class="device-row-top"><span class="device-row-name">${d.name}</span><span class="device-row-ratio">${d.label}</span></div>
          <div class="device-row-sub">${d.sub}</div>
        </div>` : '').join('')}
    `).join('');
    devicePanel.querySelectorAll('.device-row').forEach(el => el.addEventListener('click', () => {
      state.deviceIndex = parseInt(el.dataset.idx, 10);
      closePanel(); renderFrame();
    }));
  }
  function openPanel(){ state.panelOpen = true; devicePanel.classList.add('open'); deviceBtn.classList.add('open'); }
  function closePanel(){ state.panelOpen = false; devicePanel.classList.remove('open'); deviceBtn.classList.remove('open'); }
  deviceBtn.addEventListener('click', e => {
    e.stopPropagation();
    state.panelOpen ? closePanel() : (renderDevicePanel(), openPanel());
  });
  document.addEventListener('click', e => {
    if(state.panelOpen && !devicePanel.contains(e.target) && e.target !== deviceBtn) closePanel();
  });

  // ---------- render ----------
  const BEZEL = { island:{side:12,top:12,bottom:12}, hole:{side:12,top:12,bottom:12} };
  const RADIUS = { island:{bz:54,sc:42}, hole:{bz:44,sc:32} };
  function nowTime(){
    const d = new Date();
    let h = d.getHours() % 12; if(h === 0) h = 12;
    return h + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function renderFrame(){
    // 다시 그리기 전에 각 화면의 스크롤 위치를 탭에 기억
    frame.querySelectorAll('.pane').forEach(pn => {
      const t = tabById(+pn.dataset.tab), s = pn.querySelector('.screen');
      if(t && s) t.scroll = s.scrollTop;
    });

    const dev = DEVICES[state.deviceIndex];
    deviceBtnLabel.textContent = dev.name;
    deviceBtnRatio.textContent = dev.label;
    splitBtn.classList.toggle('on', state.split);

    const bz = BEZEL[dev.kind], rad = RADIUS[dev.kind];
    const screenW = CONTENT_WIDTH;
    const screenH = Math.round(CONTENT_WIDTH * dev.ratio);
    const outerW = screenW + bz.side*2, outerH = screenH + bz.top + bz.bottom;
    const idxs = state.split ? [0,1] : [0];

    let chrome = `<div class="home-indicator"></div>`;
    chrome += dev.kind === 'island' ? `<div class="island"></div>` : `<div class="punch-hole"></div>`;

    const statusBar = `
      <div class="status-bar">
        <span class="status-time">${nowTime()}</span>
        <span class="status-icons">
          <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
          <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="19" height="10" rx="2.5"/><rect x="2.5" y="2.5" width="14" height="7" fill="currentColor" stroke="none"/><path d="M21.5 4.5v3" stroke-linecap="round"/></svg>
        </span>
      </div>`;

    frame.innerHTML = idxs.map(p => {
      const tab = paneTab(p);
      let content;
      if(!tab.images.length){
        content = `
          <div class="empty-screen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
            </svg>
            <div class="empty-main">
              <p>여기에 원고 파일을<br>드래그하거나 탭해서 올려보세요</p>
              <span class="hint">jpg · png · webp</span>
            </div>
            <div class="empty-tips">
              <div class="tip-row">⇧ Shift + 스크롤 — 3배속 스크롤</div>
              ${state.split ? '<div class="tip-row">Ctrl + 스크롤 — 두 화면 동시 스크롤</div>' : ''}
              <div class="tip-row">서버 저장 없음 — 창을 닫으면 자동 삭제</div>
            </div>
          </div>`;
      } else {
        content = tab.images.filter(i => i.loaded).map(img =>
          `<div class="cut-wrap"><img src="${img.url}" width="${img.w}" height="${img.h}" alt="${esc(img.name)}"></div>`).join('');
      }
      return `
        <div class="pane${state.split && state.focus === p ? ' focus' : ''}" data-pane="${p}" data-tab="${tab.id}" style="width:${outerW}px;height:${outerH}px;">
          <div class="bezel" style="width:${outerW}px;height:${outerH}px;padding:${bz.top}px ${bz.side}px ${bz.bottom}px;--bz-radius:${rad.bz}px;">
            <div class="screen" style="width:${screenW}px;height:${screenH}px;--sc-radius:${rad.sc}px;">
              ${statusBar}${content}
            </div>
            ${chrome}
          </div>
          <div class="scrollbar-track" style="top:${bz.top}px;height:${screenH}px;"><div class="scrollbar-thumb"></div></div>
        </div>`;
    }).join('');

    const totalW = outerW * idxs.length + GAP * (idxs.length - 1);
    frame.style.width = totalW + 'px';
    frame.style.height = outerH + 'px';
    layoutStage(totalW, outerH);

    frame.querySelectorAll('.pane').forEach(pn => {
      pn.querySelector('.screen').scrollTop = tabById(+pn.dataset.tab).scroll || 0;
      setupScrollbar(pn);
    });
  }

  function layoutStage(totalW, totalH){
    const scale = Math.min(1, (stage.clientWidth - 64) / totalW, (stage.clientHeight - 64) / totalH);
    frame.style.transform = `scale(${scale})`;
    frameSizer.style.width = (totalW * scale) + 'px';
    frameSizer.style.height = (totalH * scale) + 'px';
    currentScale = scale;
  }

  window.addEventListener('resize', renderFrame);
  new ResizeObserver(renderFrame).observe(stage);

  renderTabs();
  renderFrame();
})();
</script>
</body>
</html>
